<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedCare Pharma · Inventory &amp; Demand Intelligence</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">
<style>
:root{
  --ink:#0f1c2b; --ink2:#46505c; --muted:#6c7682; --line:#e2e6ea; --paper:#f5f7fa; --card:#ffffff;
  --side:#0f2a4a; --side-ink:#e8eef6; --side-muted:#9fb3c8; --hover:#eef3f8;
  --brand:#1c5cab; --brand2:#104281;
  --crit:#d03b3b; --warn:#e8743f; --attn:#e0a100; --good:#0c9a0c; --info:#2a78d6; --neutral:#8a8f96;
  --crit-bg:#fdecec; --warn-bg:#fdf0e8; --attn-bg:#fff7dc; --good-bg:#e9f6e9; --info-bg:#e8f1fc; --neutral-bg:#f0efec;
  --crit-fg:#9f1f1f; --warn-fg:#8a3d12; --attn-fg:#6b4e00; --good-fg:#0b5e0b; --info-fg:#184f95; --neutral-fg:#52514e;
  --s1:#2a78d6; --s2:#eb6834; --s3:#4a3aa7; --s1l:#9ec5f4; --grid:#e8eaed;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e9eef4; --ink2:#c3cad3; --muted:#98a3ae; --line:#2b3a4a; --paper:#0d1620; --card:#152230;
    --side:#0a1a2c; --side-ink:#e8eef6; --side-muted:#8ea3b8; --hover:#1c2d3f; --brand:#3987e5; --brand2:#2a78d6;
    --crit-bg:#3a1a1a; --warn-bg:#3a2415; --attn-bg:#3a300f; --good-bg:#12301a; --info-bg:#132a45; --neutral-bg:#2a2d31;
    --crit-fg:#ff9a9a; --warn-fg:#ffbb94; --attn-fg:#f5d77a; --good-fg:#8fe08f; --info-fg:#9ec5f4; --neutral-fg:#c3c2b7;
    --s1:#3987e5; --s2:#d95926; --s3:#9085e9; --s1l:#2f5c8f; --grid:#223242;
  }
}
:root[data-theme="dark"]{
  --ink:#e9eef4; --ink2:#c3cad3; --muted:#98a3ae; --line:#2b3a4a; --paper:#0d1620; --card:#152230;
  --side:#0a1a2c; --side-ink:#e8eef6; --side-muted:#8ea3b8; --hover:#1c2d3f; --brand:#3987e5; --brand2:#2a78d6;
  --crit-bg:#3a1a1a; --warn-bg:#3a2415; --attn-bg:#3a300f; --good-bg:#12301a; --info-bg:#132a45; --neutral-bg:#2a2d31;
  --crit-fg:#ff9a9a; --warn-fg:#ffbb94; --attn-fg:#f5d77a; --good-fg:#8fe08f; --info-fg:#9ec5f4; --neutral-fg:#c3c2b7;
  --s1:#3987e5; --s2:#d95926; --s3:#9085e9; --s1l:#2f5c8f; --grid:#223242;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
.app{display:flex;min-height:100vh}
aside{width:260px;flex:none;background:var(--side);color:var(--side-ink);padding:1.1rem .9rem;position:sticky;top:0;height:100vh;overflow:auto}
aside .brand{font-weight:800;letter-spacing:.1em}
aside .tag{font-size:.8rem;color:var(--side-muted);margin-bottom:1rem}
nav a{display:flex;gap:.6rem;align-items:center;padding:.55rem .7rem;border-radius:8px;color:var(--side-ink);text-decoration:none;margin-bottom:2px;font-size:.95rem}
nav a:hover{background:rgba(255,255,255,.08)} nav a.on{background:rgba(255,255,255,.16);font-weight:650}
.side-h{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--side-muted);margin:1.2rem 0 .4rem}
.side-box{font-size:.8rem;color:var(--side-ink);line-height:1.55}
.side-box .m{color:var(--side-muted)}
aside button{width:100%;margin-top:.5rem;background:rgba(255,255,255,.1);color:var(--side-ink);border:1px solid rgba(255,255,255,.2)}
main{flex:1;min-width:0;padding:1.1rem 1.6rem 3rem;max-width:1440px}
.header{background:linear-gradient(90deg,#0f2a4a,#1c5cab);color:#fff;border-radius:12px;padding:14px 20px;margin-bottom:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.header .b{font-weight:800;letter-spacing:.12em;font-size:1.05rem}.header .s{opacity:.85;font-size:.88rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:3px 10px;font-size:.78rem;white-space:nowrap}
h1{font-size:1.45rem;margin:.2rem 0 .1rem}
.sub{color:var(--ink2);font-size:.9rem;margin:0 0 1rem}
h2{font-size:1.02rem;margin:1.4rem 0 .55rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
.grid{display:grid;gap:.75rem}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g5{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g6{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem}.two>*,.grid>*{min-width:0}.two.w{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
@media(max-width:1050px){.two,.two.w{grid-template-columns:1fr}}
@media(max-width:820px){.app{flex-direction:column}aside{width:auto;height:auto;position:static}main{padding:1rem}}
.kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.75rem .95rem}
.kpi .l{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);font-weight:650;min-height:2.2em}
.kpi .v{font-size:clamp(1.2rem,1.9vw,1.65rem);overflow-wrap:anywhere;font-weight:780;line-height:1.15;margin-top:.15rem}
.kpi .s{font-size:.74rem;color:var(--muted);margin-top:.15rem}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:.8rem .95rem;margin-bottom:.65rem}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.card .t{font-weight:750}
.card .q{font-size:1.2rem;font-weight:800;margin:.35rem 0 .1rem}
.card .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:.35rem .9rem;margin-top:.45rem}
.card .fields div{font-size:.78rem;color:var(--ink2)}.card .fields b{display:block;color:var(--ink);font-size:.92rem}
.card .why{font-size:.83rem;color:var(--ink2);margin-top:.45rem;line-height:1.4}
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:.1rem .75rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem}
.badge{display:inline-block;border-radius:6px;padding:2px 8px;font-size:.74rem;font-weight:700;white-space:nowrap}
.flow{display:flex;flex-wrap:wrap;margin:.4rem 0}
.step{flex:1 1 135px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--line);border-radius:10px;padding:.6rem .75rem;margin:4px 16px 4px 0;position:relative}
.step:not(:last-child)::after{content:"➜";position:absolute;right:-15px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem}
.step .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);font-weight:650}
.step .v{font-size:1.1rem;font-weight:780;margin-top:2px}
.step .d{font-size:.72rem;color:var(--muted);margin-top:2px;line-height:1.3}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.7rem;margin-bottom:.8rem;align-items:end}
label.f{display:block;font-size:.76rem;color:var(--ink2);margin-bottom:.2rem;font-weight:600}
select,input[type=text]{width:100%;padding:.45rem .55rem;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
label.chk{display:flex;gap:.45rem;align-items:center;font-size:.86rem;padding:.45rem 0}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.4rem .8rem;cursor:pointer}
button:hover{filter:brightness(.97)} button.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);max-height:460px}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th{position:sticky;top:0;background:var(--card);text-align:left;padding:.5rem .6rem;border-bottom:2px solid var(--line);white-space:nowrap;color:var(--ink2);font-weight:650;z-index:1}
td{padding:.4rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums} td.wrap{white-space:normal;min-width:320px}
tr.click{cursor:pointer} tr.click:hover td,tr.sel td{background:var(--hover)}
.chart{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.3rem;margin-bottom:.4rem}
.small{font-size:.8rem;color:var(--muted)}
.note{border-radius:10px;padding:.6rem .85rem;font-size:.86rem;margin-bottom:.8rem;border:1px solid var(--line);background:var(--card)}
.note.warn{background:var(--warn-bg);color:var(--warn-fg);border-color:transparent}.note.crit{background:var(--crit-bg);color:var(--crit-fg);border-color:transparent}
.note.info{background:var(--info-bg);color:var(--info-fg);border-color:transparent}
.empty{border:1px dashed var(--line);border-radius:10px;padding:1rem;color:var(--muted);background:var(--card)}
.tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--line);margin:.4rem 0 .8rem;flex-wrap:wrap}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:.45rem .8rem;color:var(--ink2)}
.tabs button.on{border-bottom-color:var(--brand);color:var(--brand);font-weight:650}
.quick{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.8rem}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
details{margin:.5rem 0} summary{cursor:pointer;font-weight:600;font-size:.9rem}
code{font-size:.82em;background:var(--hover);padding:1px 5px;border-radius:4px}
</style>
<!--PLOTLY-->
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">💊 MEDCARE PHARMA</div>
    <div class="tag">Inventory &amp; Demand Intelligence</div>
    <nav id="nav" aria-label="Pages"></nav>
    <div class="side-h">Selected item</div>
    <div class="side-box" id="focusbox"></div>
    <div class="side-h">Data</div>
    <div class="side-box" id="databox"></div>
    <button id="theme" type="button">🌓 Light / dark</button>
  </aside>
  <main>
    <div class="header"><div><div class="b">MEDCARE PHARMA</div><div class="s">Inventory &amp; Demand Intelligence · Smart Restock Alerts · Demand Sensing &amp; Replenishment</div></div>
      <div class="chips" id="chips"></div></div>
    <div id="banner"></div>
    <div id="view"></div>
  </main>
</div>
<script>
const D = /*__DATA__*/null;
</script>
<script>
"use strict";
/* =================== helpers =================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const num = v => (v === null || v === undefined || v === "" || Number.isNaN(+v)) ? null : +v;
const fmt = (v, d = 0) => num(v) === null ? "—" : (+v).toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
const sfmt = v => num(v) === null ? "—" : (Number.isInteger(+v) ? fmt(v) : fmt(v, 2));
const sum = a => a.reduce((s, x) => s + (num(x) || 0), 0);
const uniq = a => [...new Set(a)];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const K = (s, w) => s + "|" + w;
const MS = 86400000;
const addDays = (iso, n) => new Date(Date.parse(iso + "T00:00:00Z") + n * MS).toISOString().slice(0, 10);
const store = {get(k, d) { try { const v = localStorage.getItem("medcare." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
               set(k, v) { try { localStorage.setItem("medcare." + k, JSON.stringify(v)); } catch (e) { /* ignore */ } }};

const TONE = {risk: {HIGH: "crit", MEDIUM: "warn", LOW: "good"}, sev: {HIGH: "crit", MEDIUM: "warn", LOW: "attn", INFO: "info"},
  act: {REORDER: "warn", TRANSFER: "info", NO_ACTION: "good"}, exp: {EXPIRED: "neutral", NEAR_EXPIRY: "crit", EXPIRING_SOON: "warn", NORMAL: "good"}};
const ICON = {crit: "🔴", warn: "🟠", attn: "🟡", good: "🟢", info: "🔵", neutral: "⚪"};
const tone = (kind, v) => (TONE[kind] || {})[v] || "neutral";
const actLabel = a => a === "NO_ACTION" ? "NO ACTION" : String(a ?? "—");
const badge = (t, tn, icon = true) => `<span class="badge" style="color:var(--${tn}-fg);background:var(--${tn}-bg)">${icon ? ICON[tn] + " " : ""}${esc(t)}</span>`;
const riskBadge = (r, pre = "") => badge(pre + r, tone("risk", r));
const actBadge = a => badge(actLabel(a), tone("act", a), false);
const sevBadge = s => badge(s, tone("sev", s));
const iconTxt = (kind, v) => v == null ? "—" : `${ICON[tone(kind, v)]} ${esc(kind === "act" ? actLabel(v) : v)}`;
const ALERT_LABEL = {STOCKOUT_RISK_HIGH: "Stock-out risk · HIGH", STOCKOUT_RISK_MEDIUM: "Stock-out risk · MEDIUM", EXPIRY_RISK_HIGH: "Expiry risk · HIGH",
  EXPIRY_RISK_MEDIUM: "Expiry risk · MEDIUM", E1_THRESHOLD: "E1 threshold", TRANSFER_RECOMMENDED: "Transfer recommended", REORDER_RECOMMENDED: "Reorder recommended"};
const VALUE_LABEL = {shortage_units: "Shortage (units)", potential_expiry_excess_units: "Potential expiry excess (units)", units_below_threshold: "Units below threshold",
  transfer_units: "Transfer units", reorder_units: "Reorder units"};
const opts = (list, sel, all) => (all ? `<option value="">${esc(all)}</option>` : "") +
  list.map(o => { const v = typeof o === "object" ? o.v : o, t = typeof o === "object" ? o.t : o; return `<option value="${esc(v)}"${String(v) === String(sel) ? " selected" : ""}>${esc(t)}</option>`; }).join("");
const sel = (label, key, list, value, all) => `<div><label class="f">${esc(label)}</label><select data-k="${key}">${opts(list, value, all)}</select></div>`;
const kpi = (label, value, sub = "", tn = "neutral") => `<div class="kpi" style="border-left-color:var(--${tn === "neutral" ? "line" : tn})"><div class="l">${esc(label)}</div><div class="v">${value}</div>${sub ? `<div class="s">${esc(sub)}</div>` : ""}</div>`;
const empty = t => `<div class="empty">${esc(t)}</div>`;
const header = (t, s) => `<h1>${t}</h1><div class="sub">${s}</div>`;
const chart = id => `<div class="chart"><div id="${id}"></div></div>`;
const table = (cols, rows, opt = {}) => `<div class="tw" style="${opt.h ? `max-height:${opt.h}px` : ""}"><table><thead><tr>${cols.map(c => `<th class="${c.n ? "n" : ""}">${esc(c.h)}</th>`).join("")}</tr></thead><tbody>${rows || `<tr><td colspan="${cols.length}" class="small">No rows.</td></tr>`}</tbody></table></div>`;
const CSV = {};
function csvOf(name, header, rows) { CSV[name] = [header, ...rows].map(r => r.map(x => { const s = String(x ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(",")).join("\n"); return `<button type="button" data-dl="${name}">⬇ Download CSV</button>`; }

function plot(id, traces, layout = {}, height = 340) {
  const el = document.getElementById(id); if (!el || !window.Plotly) return;
  const ink = css("--ink2"), grid = css("--grid");
  const base = {height, margin: {l: 60, r: 16, t: layout.title ? 44 : 16, b: 50}, paper_bgcolor: css("--card"), plot_bgcolor: css("--card"),
    font: {family: css("--font"), size: 12, color: ink}, hoverlabel: {font: {size: 12}}, bargap: .25,
    legend: {orientation: "h", y: 1.02, yanchor: "bottom", x: 0}, xaxis: {gridcolor: grid, linecolor: css("--line"), automargin: true, showgrid: false},
    yaxis: {gridcolor: grid, zeroline: false, automargin: true}};
  const L = {...base, ...layout, xaxis: {...base.xaxis, ...(layout.xaxis || {})}, yaxis: {...base.yaxis, ...(layout.yaxis || {})}};
  if (layout.title) { L.title = {text: layout.title, x: .01, xanchor: "left", y: 1, yref: "container", yanchor: "top", pad: {t: 10}, font: {size: 13, color: css("--ink")}};
    const hasLegend = layout.showlegend !== false && traces.length > 1; L.margin = {...L.margin, t: hasLegend ? 78 : 44}; }
  Plotly.react(el, traces, L, {displayModeBar: false, responsive: true});
}

/* =================== data =================== */
const DEC = D.decisions || [], TRF = D.transfers || [], ALR = D.alerts || [], BAT = D.batches || [], BSUM = D.batchSummary || [];
const DMAP = Object.fromEntries(DEC.map(d => [K(d.sku_id, d.warehouse_id), d]));
const SKUS = uniq(DEC.map(d => d.sku_id)).sort(), WHS = uniq(DEC.map(d => d.warehouse_id)).sort();
const whsOf = s => DEC.filter(d => d.sku_id === s).map(d => d.warehouse_id).sort();
const fcOf = (s, w) => D.forecast[K(s, w)] || [];
const trIn = (s, w) => TRF.filter(t => t.sku_id === s && t.destination_warehouse === w);
const trOut = (s, w) => TRF.filter(t => t.sku_id === s && t.source_warehouse === w);
const REAL = !D.model.pipeline || D.model.pipeline === "Chronos2Pipeline";
const localTime = iso => { try { const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString("en-GB", {day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit"}); } catch (e) { return iso; } };
const niceDate = iso => new Date(iso + "T00:00:00Z").toLocaleDateString("en-GB", {day: "2-digit", month: "short", year: "numeric", timeZone: "UTC"});

/* =================== state =================== */
const S = {page: "dashboard",
  focus: store.get("focus", {sku: DMAP["M001|W002"] ? "M001" : SKUS[0], wh: DMAP["M001|W002"] ? "W002" : whsOf(SKUS[0])[0]}),
  inv: {sku: "", wh: "", risk: "", act: "", e1: false}, fc: {win: "120"}, al: {type: "", sev: "", sku: "", wh: "", sel: null, tab: "alerts"},
  ex: {sku: "", wh: "", risk: "HIGH", only: true}, rec: {act: "TRANSFER", sku: "", wh: "", limit: "20"},
  sl: {sku: "", wh: "", gran: "month", measure: "units", tab: "period"}, sp: {year: "", month: "", sku: "", wh: ""},
  se: {season: "flu", sku: "", wh: ""}};
if (!DMAP[K(S.focus.sku, S.focus.wh)]) S.focus = {sku: SKUS[0], wh: whsOf(SKUS[0])[0]};
function setFocus(s, w) { S.focus = {sku: s, wh: w}; store.set("focus", S.focus); }

/* =================== shared components =================== */
function step(k, v, d = "", tn = "neutral") { return `<div class="step" style="border-top-color:var(--${tn === "neutral" ? "line" : tn})"><div class="k">${esc(k)}</div><div class="v">${v}</div>${d ? `<div class="d">${d}</div>` : ""}</div>`; }
function trace(d) {
  const fc = fcOf(d.sku_id, d.warehouse_id), tin = trIn(d.sku_id, d.warehouse_id);
  const bySrc = {}; tin.forEach(t => { (bySrc[t.source_warehouse] = bySrc[t.source_warehouse] || []).push(t.transfer_quantity); });
  const src = Object.entries(bySrc).map(([w, q]) => `${esc(w)} (${fmt(sum(q))}${q.length > 1 ? ` in ${q.length} batches` : ""})`).join(", ");
  const s = [
    step("Item", `${esc(d.sku_id)} / ${esc(d.warehouse_id)}`, `Recorded ${fmt(d.current_stock)} · expired ${fmt(d.expired_stock)}`),
    step("Usable stock", `${fmt(d.usable_stock_before)} units`, `Min threshold ${fmt(d.min_threshold)}${d.e1_threshold_alert ? " · E1 alert" : ""}`, d.e1_threshold_alert ? "attn" : "neutral"),
    step("Chronos-2 forecast", fc.length ? `${fmt(sum(fc), 2)} / ${fc.length} d` : "Not available", `Lead-time demand (${fmt(d.lead_time_days)} d): ${fmt(d.lead_time_demand, 2)}`, "info"),
    step("P1 stock-out risk", esc(d.risk_status), `Projected usable ${fmt(d.projected_inventory, 2)} · safety ${fmt(d.safety_stock)}`, tone("risk", d.risk_status)),
    d.transfer_in_quantity ? step("Internal transfer in", `+${fmt(d.transfer_in_quantity)} units`, `from ${src || esc((d.source_warehouses || []).join(", "))}`, "info")
                           : step("Internal transfer in", "None", "no inbound transfer planned"),
    step("Usable after transfers", `${fmt(d.usable_stock_after)} units`),
    step("Required stock", `≈ ${fmt(d.required_stock, 2)}`, "lead-time demand + safety stock"),
    step("Remaining shortage", `≈ ${fmt(d.remaining_shortage, 2)}`, `before transfers: ${fmt(d.shortage_before, 2)}`, (d.remaining_shortage || 0) > 0 ? "crit" : "good"),
    step("Final decision", d.final_action === "REORDER" ? `REORDER ${fmt(d.reorder_quantity)} units` : actLabel(d.final_action), esc(d.reason), tone("act", d.final_action)),
  ];
  return `<div class="flow">${s.join("")}</div>`;
}
function focusPicker(keyPrefix = "focus") {
  const s = S.focus.sku, w = S.focus.wh;

/* =================== sales helpers (display-only totals / averages) =================== */
function periodOf(iso, gran) { if (gran === "week") { const t = Date.parse(iso + "T00:00:00Z"), dow = (new Date(t).getUTCDay() + 6) % 7; return new Date(t - dow * MS).toISOString().slice(0, 10); }
  return gran === "year" ? iso.slice(0, 4) : gran === "month" ? iso.slice(0, 7) : iso; }
function periodLabel(p, gran) {
  if (gran === "month") return new Date(p + "-01T00:00:00Z").toLocaleDateString("en-GB", {month: "short", year: "numeric", timeZone: "UTC"});
  if (gran === "date") return niceDate(p); if (gran === "week") return "Wk of " + niceDate(p); return p;
}
function periodDays(p, gran) {
  if (gran === "year") { const y = +p; return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0 ? 366 : 365; }
  if (gran === "month") { const [y, m] = p.split("-").map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); } return gran === "week" ? 7 : 1;
}
function salesAgg(f, gran) {
  const out = new Map();
  for (const [key, s] of Object.entries(D.sales || {})) {
    const [sk, wh] = key.split("|"); if ((f.sku && sk !== f.sku) || (f.wh && wh !== f.wh)) continue;
    for (let i = 0; i < s.u.length; i++) { if (s.u[i] == null) continue;
      const iso = addDays(s.start, i), p = periodOf(iso, gran); let r = out.get(p);
      if (!r) { r = {period: p, units: 0, revenue: 0, dates: new Set(), start: iso, end: iso}; out.set(p, r); }
      r.units += s.u[i]; r.revenue += s.r[i] || 0; r.dates.add(iso); if (iso < r.start) r.start = iso; if (iso > r.end) r.end = iso; } }
  return [...out.values()].sort((a, b) => a.period.localeCompare(b.period)).map(r => ({...r, days: r.dates.size, partial: r.dates.size < periodDays(r.period, gran)}));
}
function demandAgg(f, gran) {
  const out = new Map();
  for (const [key, s] of Object.entries(D.hist || {})) {
    const [sk, wh] = key.split("|"); if ((f.sku && sk !== f.sku) || (f.wh && wh !== f.wh)) continue;
    for (let i = 0; i < s.v.length; i++) { const p = periodOf(addDays(s.start, i), gran); out.set(p, (out.get(p) || 0) + s.v[i]); } }
  return out;
}
const SALES_TOTAL = (() => { const r = salesAgg({}, "year"); return {units: sum(r.map(x => x.units)), revenue: sum(r.map(x => x.revenue)), days: (() => { const s = new Set(); r.forEach(x => x.dates.forEach(d => s.add(d))); return s.size; })()}; })();

const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const SALES_MONTHS = (() => { const m = salesAgg({}, "month"); return m.map(r => ({p: r.period, partial: r.partial})); })();
function scanSales(f, prefix) {
  // totals for one period (prefix "YYYY" or "YYYY-MM"), plus per-day, per-SKU and per-warehouse splits
  const t = {units: 0, revenue: 0, days: new Set(), byDay: new Map(), bySku: {}, byWh: {}};
  for (const [key, s] of Object.entries(D.sales || {})) {
    const [sk, wh] = key.split("|"); if ((f.sku && sk !== f.sku) || (f.wh && wh !== f.wh)) continue;
    for (let i = 0; i < s.u.length; i++) { if (s.u[i] == null) continue; const iso = addDays(s.start, i); if (!iso.startsWith(prefix)) continue;
      const u = s.u[i], r = s.r[i] || 0; t.units += u; t.revenue += r; t.days.add(iso);
      const bd = t.byDay.get(iso) || {u: 0, r: 0}; bd.u += u; bd.r += r; t.byDay.set(iso, bd);
      (t.bySku[sk] = t.bySku[sk] || {u: 0, r: 0}); t.bySku[sk].u += u; t.bySku[sk].r += r;
      (t.byWh[wh] = t.byWh[wh] || {u: 0, r: 0}); t.byWh[wh].u += u; t.byWh[wh].r += r; } }
  t.nDays = t.days.size; return t;
}
function scanDemand(f, prefix, gran) {

  for (const [key, s] of Object.entries(D.hist || {})) { const [sk, wh] = key.split("|"); if ((f.sku && sk !== f.sku) || (f.wh && wh !== f.wh)) continue;
    for (let i = 0; i < s.v.length; i++) { const iso = addDays(s.start, i); if (!iso.startsWith(prefix)) continue; const p = periodOf(iso, gran); out.set(p, (out.get(p) || 0) + s.v[i]); } }
  return out;
}

function nextOccurrence(se) {

  let e = d; while (inSeason(addDays(e, 1), se)) e = addDays(e, 1); return [d, e];
}
function seasonStats(f, se) {
  const r = {sIn: {u: 0, r: 0, d: new Set()}, sOut: {u: 0, r: 0, d: new Set()}, dIn: 0, dInN: new Set(), dOut: 0, dOutN: new Set(), flag: 0, flagN: 0,
    bySku: {}, byWh: {}, monthly: new Map(), range: [null, null]};
  for (const [key, s] of Object.entries(D.sales || {})) { const [sk, wh] = key.split("|"); if ((f.sku && sk !== f.sku) || (f.wh && wh !== f.wh)) continue;
    for (let i = 0; i < s.u.length; i++) { if (s.u[i] == null) continue; const iso = addDays(s.start, i), yes = inSeason(iso, se), b = yes ? r.sIn : r.sOut;
      b.u += s.u[i]; b.r += s.r[i] || 0; b.d.add(iso);
      if (yes) { if (!r.range[0] || iso < r.range[0]) r.range[0] = iso; if (!r.range[1] || iso > r.range[1]) r.range[1] = iso; }
      for (const [map, k] of [[r.bySku, sk], [r.byWh, wh]]) { const x = map[k] = map[k] || {inU: 0, inD: new Set(), outU: 0, outD: new Set()}; if (yes) { x.inU += s.u[i]; x.inD.add(iso); } else { x.outU += s.u[i]; x.outD.add(iso); } }
      const m = iso.slice(0, 7), mm = r.monthly.get(m) || {u: 0, d: new Set()}; mm.u += s.u[i]; mm.d.add(iso); r.monthly.set(m, mm); } }
  for (const [key, s] of Object.entries(D.hist || {})) { const [sk, wh] = key.split("|"); if ((f.sku && sk !== f.sku) || (f.wh && wh !== f.wh)) continue;
    for (let i = 0; i < s.v.length; i++) { const iso = addDays(s.start, i); if (inSeason(iso, se)) { r.dIn += s.v[i]; r.dInN.add(iso); r.flag += (s.season ? s.season[i] : 0); r.flagN += 1; } else { r.dOut += s.v[i]; r.dOutN.add(iso); } } }
  return r;
}
function pSeasons() {
  const f = S.se, se = SEASONS[f.season];
  let h = header("🌦️ Seasonal Insights", "Sales, demand and the forecast for three health seasons. Pick a season, then all SKUs / warehouses or a single one.");
  h += `<div class="grid g4" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${Object.entries(SEASONS).map(([k, x]) => `<button type="button" data-season="${k}" class="card" style="text-align:left;margin:0;cursor:pointer;border-left-color:var(--${k === f.season ? "brand" : "line"});${k === f.season ? "background:var(--info-bg)" : ""}">
    <div class="t">${x.icon} ${esc(x.name)}</div><div class="small">${esc(x.sub)} · ${esc(monthsText(x))}</div></button>`).join("")}</div>`;
  const skus = uniq(Object.keys(D.sales || {}).concat(Object.keys(D.hist || {})).map(k => k.split("|")[0])).sort();
  h += `<div class="filters" style="margin-top:.8rem;grid-template-columns:repeat(2,minmax(160px,260px))">${sel("SKU", "se.sku", skus, f.sku, "All SKUs")}${sel("Warehouse", "se.wh", WHS, f.wh, "All warehouses")}</div>`;
  const r = seasonStats(f, se), scope = `${f.sku || "all SKUs"} · ${f.wh || "all warehouses"}`;
  const aIn = r.sIn.d.size ? r.sIn.u / r.sIn.d.size : null, aOut = r.sOut.d.size ? r.sOut.u / r.sOut.d.size : null, up = aIn && aOut ? aIn / aOut - 1 : null;
  const dIn = r.dInN.size ? r.dIn / r.dInN.size : null, dOut = r.dOutN.size ? r.dOut / r.dOutN.size : null, dUp = dIn && dOut ? dIn / dOut - 1 : null;
  const pct = v => v == null ? "—" : `${v >= 0 ? "▲ +" : "▼ "}${(v * 100).toFixed(1)}%`;
  h += `<h2>${se.icon} ${esc(se.name)} — ${esc(scope)}</h2><div class="small" style="margin-bottom:.5rem">Months: ${esc(monthsText(se))}.${r.range[0] ? ` Sales data in this season: ${niceDate(r.range[0])} – ${niceDate(r.range[1])} (${r.sIn.d.size} days).` : " No sales data falls in this season."}</div>`;
  h += `<div class="grid g6">${kpi("Units sold in season", fmt(r.sIn.u), `${r.sIn.d.size} days`, "info")}${kpi("Revenue in season", fmt(r.sIn.r), "", "info")}
    ${kpi("Avg units / day in season", fmt(aIn, 1), `rest of year ${fmt(aOut, 1)}`, "info")}${kpi("Seasonal sales uplift", pct(up), "in-season vs rest of year, per day", up == null ? "neutral" : up >= 0 ? "good" : "warn")}
    ${kpi("Share of yearly units", r.sIn.u + r.sOut.u ? `${(r.sIn.u / (r.sIn.u + r.sOut.u) * 100).toFixed(1)}%` : "—", `${se.months.length} of 12 months`)}
    ${kpi("Demand uplift", pct(dUp), `avg/day ${fmt(dIn, 1)} vs ${fmt(dOut, 1)}`, dUp == null ? "neutral" : dUp >= 0 ? "good" : "warn")}</div>
    <div class="small" style="margin-top:.35rem">In the demand data, the season flag was active on ${r.flagN ? (r.flag / r.flagN * 100).toFixed(0) : "—"}% of item-days in these months. The data has no disease or weather labels: seasons here are calendar months.</div>`;
  h += `${chart("c-se-m")}`;
  const upRows = (map) => Object.entries(map).map(([k, x]) => ({k, a: x.inD.size ? x.inU / x.inD.size : null, b: x.outD.size ? x.outU / x.outD.size : null, u: x.inU}))
    .map(o => ({...o, up: o.a && o.b ? o.a / o.b - 1 : null})).sort((a, b) => (b.up ?? -9) - (a.up ?? -9));

    rows.map(o => `<tr><td>${esc(o.k)}</td><td class="n">${fmt(o.u)}</td><td class="n">${fmt(o.a, 1)}</td><td class="n">${fmt(o.b, 1)}</td><td class="n" style="color:var(--${o.up >= 0 ? "good" : "warn"}-fg)">${pct(o.up)}</td></tr>`).join(""), {h: 360})}</div>`;

    const lyAvg = lyN.size ? ly / lyN.size : null, vsLy = lyAvg ? fcAvg / lyAvg - 1 : null;
    const sig = s => selDec.filter(d => d.seasonal_signal === s).length;
    h += `<div class="small" style="margin-bottom:.5rem">The Chronos-2 model forecasts ${fcDays} days ahead (${niceDate(D.fcStart)} – ${niceDate(fcEnd)}). ${overlap.length} of those days fall in this season, so the prediction below covers the start of the season.</div>
      <div class="grid g6">${kpi("Forecast demand (season days)", fmt(fcTot), `${overlap.length} days · Chronos-2`, "info")}${kpi("Forecast avg / day", fmt(fcAvg, 1), scope, "info")}
      ${kpi("Same days last year (avg / day)", fmt(lyAvg, 1), `${niceDate(lyStart)} – ${niceDate(lyEnd)}`)}${kpi("Forecast vs last year", pct(vsLy), "avg demand per day", vsLy == null ? "neutral" : vsLy >= 0 ? "warn" : "good")}
      ${kpi("Last season avg / day", fmt(dIn, 1), "demand history, whole season")}${kpi("🔺 ELEVATED seasonal signal", fmt(sig("ELEVATED")), `${sig("SEASONAL")} seasonal · ${sig("NORMAL")} normal · ${selDec.filter(d => d.seasonal_covariate_gap).length} covariate gaps`, sig("ELEVATED") ? "warn" : "neutral")}</div>
      ${chart("c-se-fc")}`;

      table([{h: "SKU"}, {h: "Warehouse"}, {h: "Seasonal signal"}, {h: "Covariate gap"}, {h: "Stock-out risk"}, {h: "Final action"}, {h: "Forecast (season days)", n: 1}, {h: "Reason"}],
        elev.map(d => `<tr class="click" data-open="${esc(K(d.sku_id, d.warehouse_id))}"><td>${esc(d.sku_id)}</td><td>${esc(d.warehouse_id)}</td><td>${d.seasonal_signal === "ELEVATED" ? badge("ELEVATED", "warn") : badge("SEASONAL", "attn", false)}</td>
        <td>${d.seasonal_covariate_gap ? "Yes" : "No"}</td><td>${iconTxt("risk", d.risk_status)}</td><td>${iconTxt("act", d.final_action)}${d.final_action === "REORDER" ? " " + fmt(d.reorder_quantity) : ""}</td>
        <td class="n">${fmt(overlap.reduce((a, i) => a + (fcOf(d.sku_id, d.warehouse_id)[i] || 0), 0), 1)}</td><td class="wrap">${esc(d.seasonal_reason)}</td></tr>`).join(""), {h: 380})

      <div class="grid g4">${kpi("Last season: demand avg / day", fmt(dIn, 1), scope)}${kpi("Last season: sales avg / day", fmt(aIn, 1), scope)}

/* =================== Email notifications panel =================== */
function emailPanel() {
  const N = D.notifications || [];
  let h = `<h2>📧 Email notifications (red alerts)</h2>`;
  if (!N.length) return h + `<div class="note info">No email notifications logged yet. Red alerts (HIGH stock-out and HIGH expiry) are emailed by <code>red_alert_mailer.py</code>; see FRONTEND_README.md to set it up, then rebuild this page to see the log here.</div>`;
  const c = s => N.filter(n => n.status === s).length;
  h += `<div class="grid g4">${kpi("✅ Sent", fmt(c("SENT")), "accepted by the mail server", "good")}${kpi("❌ Failed", fmt(c("FAILED")), "see error column", c("FAILED") ? "crit" : "neutral")}
    ${kpi("📥 Outbox only", fmt(c("OUTBOX")), "recorded, not sent")}${kpi("Recipient", esc((N.find(n => n.recipient) || {}).recipient || "—"), "")}</div>`;
  return h + `<div style="margin-top:.6rem">${table([{h: "Time (UTC)"}, {h: "Status"}, {h: "Severity"}, {h: "Alert type"}, {h: "SKU"}, {h: "Warehouse"}, {h: "Action"}, {h: "Error"}],
    N.slice(0, 200).map(n => `<tr><td>${esc(n.created_at_utc)}</td><td>${n.status === "SENT" ? "✅ SENT" : n.status === "FAILED" ? "❌ FAILED" : "📥 " + esc(n.status)}</td><td>${iconTxt("sev", n.severity)}</td>
    <td>${esc(ALERT_LABEL[n.alert_type] || n.alert_type)}</td><td>${esc(n.sku_id)}</td><td>${esc(n.warehouse_id)}</td><td>${esc(actLabel(n.recommended_action))}</td><td class="wrap small">${esc(n.error)}</td></tr>`).join(""), {h: 320})}</div>`;
}

function render() {

  $("#view").innerHTML = r.html; try { r.after && r.after(); } catch (e) { console.error(e); }
}
function route() { const k = location.hash.replace("#/", "") || "dashboard"; S.page = PAGES[k] ? k : "dashboard"; window.scrollTo(0, 0); render(); }
